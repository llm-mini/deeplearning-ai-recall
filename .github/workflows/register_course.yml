name: Register DeepLearning.AI Course

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'DeepLearning.AI or Coursera course/specialization URL'
        required: true
        type: string
      type:
        description: 'Type of resource'
        required: true
        type: choice
        options:
          - course
          - specialization
        default: 'course'

  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build-and-summarize:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, '[Register]:'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parse Trigger Inputs
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "URL=${{ github.event.inputs.url }}" >> $GITHUB_ENV
            if [ "${{ github.event.inputs.type }}" = "specialization" ]; then
              echo "IS_SPEC=--specialization" >> $GITHUB_ENV
            else
              echo "IS_SPEC=" >> $GITHUB_ENV
            fi
          else
            # Extract URL from issue body
            BODY="${{ github.event.issue.body }}"
            URL=$(echo "$BODY" | grep -oE "https?://[a-zA-Z0-9./?=_-]+")
            echo "URL=$URL" >> $GITHUB_ENV
            
            # Extract type
            if echo "$BODY" | grep -qi "specialization"; then
              echo "IS_SPEC=--specialization" >> $GITHUB_ENV
            else
              echo "IS_SPEC=" >> $GITHUB_ENV
            fi
          fi

      - name: Run Scraper & Summarizer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'nvidia/nemotron-3-embed-1b:free' }}
        run: |
          python scraper.py --url "$URL" $IS_SPEC

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add courses.json docs/
          git diff-index --quiet HEAD || git commit -m "Auto-registered course: $URL"
          git push

      - name: Close Issue (if issue-triggered)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Successfully registered and summarized the course! The changes have been pushed and the live dashboard is redeploying.`
            });
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
